# Production with Docker, e.g. on the Raspberry Pi.
#   cp .env.production.example .env.production   # fill in the values
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
# With Cloudflare Tunnel (HTTPS from outside, no port forwarding):
#   docker compose -f docker-compose.prod.yml --env-file .env.production --profile tunnel up -d --build

name: wine-tasting

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: wine
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD setzen}
      POSTGRES_DB: wine_tasting
    volumes:
      # On the Pi, point this at the SSD, not the SD card
      - ${DB_DATA_DIR:-./data/postgres}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wine -d wine_tasting"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Runs once on every start and exits afterwards
  migrate:
    build:
      context: .
      target: build
    command: ["node", "scripts/migrate.mjs"]
    environment:
      DATABASE_URL: postgres://wine:${POSTGRES_PASSWORD}@db:5432/wine_tasting
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://wine:${POSTGRES_PASSWORD}@db:5432/wine_tasting
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET setzen (mind. 32 Zeichen)}
      APP_URL: ${APP_URL:-}
    ports:
      # Only reachable locally on the device; from outside, access goes through the tunnel (HTTPS)
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  tunnel:
    image: cloudflare/cloudflared:2026.9.3
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      # No ${…:?}: Compose would require it even without the tunnel profile active
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - app
    profiles: ["tunnel"]
